<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>记忆翻牌</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:340px;margin-bottom:12px}
.bar a,.bar button{background:#6B3FA0;border:none;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;text-decoration:none}
.bar a:hover,.bar button:hover{background:#56328a}
.record{max-width:340px;width:100%;font-size:13px;color:#666;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:340px;width:100%}

/* 🔧 新增：3D 翻转动画相关样式 */
.card{aspect-ratio:1;perspective:800px;cursor:pointer;user-select:none}
.card-inner{position:relative;width:100%;height:100%;transition:transform 0.4s ease;transform-style:preserve-3d}
.card.open .card-inner,.card.matched .card-inner{transform:rotateY(180deg)}

.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold}

/* 背面（问号） */
.card-front{background:#6B3FA0;color:#fff}
/* 正面（图案） */
.card-back{background:#fff;border:2px solid #6B3FA0;color:#222;transform:rotateY(180deg)}

/* 🔧 新增：匹配成功后的特效高亮 */
.card.matched .card-back{border-color:#4CAF50;background:#f0fff0;color:#4CAF50;box-shadow:0 0 12px rgba(76,175,80,0.6);animation:pop 0.4s ease}
@keyframes pop{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.1)}100%{transform:rotateY(180deg) scale(1)}}
</style>
</head>
<body>
<div class="bar">
  <a href="javascript:history.back()">返回</a>
  <span id="info"></span>
  <button onclick="init()">重新开始</button>
</div>
<div class="record" id="record"></div>
<div class="grid" id="grid"></div>

<script>
const ID='memory';
const EMOJIS=['🐶','🐱','🐸','🦊','🐻','🐼','🐨','🦁'];
const SK='game-'+ID+'-state';
let cards,first,second,locked,done,timer,sec;

// 🔧 安全存储封装
const SafeStorage = (function() {
  let storage;
  try {
    const testKey = '__test__';
    window.localStorage.setItem(testKey, testKey);
    window.localStorage.removeItem(testKey);
    storage = window.localStorage;
  } catch (e) {
    const memory = {};
    storage = {
      getItem: (k) => memory[k] || null,
      setItem: (k, v) => { memory[k] = String(v); },
      removeItem: (k) => { delete memory[k]; }
    };
  }
  return storage;
})();

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function save(){try{SafeStorage.setItem(SK,JSON.stringify({cards,first,second,locked,done,sec}));}catch{}}

// 🔧 渲染整盘（只在初始化和恢复时调用）
function renderBoard(){
  let html='';
  cards.forEach((c,i)=>{
    let cls = c.matched ? 'matched' : (c.open ? 'open' : '');
    html += `
      <div class="card ${cls}" data-i="${i}">
        <div class="card-inner">
          <div class="card-face card-front">?</div>
          <div class="card-face card-back">${c.v}</div>
        </div>
      </div>`;
  });
  document.getElementById('grid').innerHTML=html;
}

// 🔧 事件委托：避免每次渲染重新绑定事件
document.getElementById('grid').addEventListener('click', e => {
  const cardEl = e.target.closest('.card');
  if(cardEl) flip(+cardEl.dataset.i);
});

function tick(){
  if(done)return;
  sec++;
  document.getElementById('info').textContent='用时: '+sec+' 秒';
  save();
}

function flip(i){
  if(locked||cards[i].open||cards[i].matched||done)return;
  
  // 更新数据并单独更新当前 DOM，触发动画
  cards[i].open=true;
  document.querySelector(`.card[data-i="${i}"]`).classList.add('open');
  
  if(!timer){timer=setInterval(tick,1000);}
  if(first===null){
    first=i;
    save();
    return;
  }
  
  second=i;locked=true;save();
  
  if(cards[first].v===cards[second].v){
    // 匹配成功
    cards[first].matched=cards[second].matched=true;
    document.querySelector(`.card[data-i="${first}"]`).classList.add('matched');
    document.querySelector(`.card[data-i="${second}"]`).classList.add('matched');
    first=second=null;locked=false;
    save();
    if(cards.every(c=>c.matched)){
      done=true;clearInterval(timer);timer=null;
      document.getElementById('info').textContent='完成！用时 '+sec+' 秒';
      tryRecord(sec);
    }
  } else {
    // 匹配失败
    setTimeout(()=>{
      cards[first].open=cards[second].open=false;
      document.querySelector(`.card[data-i="${first}"]`).classList.remove('open');
      document.querySelector(`.card[data-i="${second}"]`).classList.remove('open');
      first=second=null;locked=false;
      save();
    },800); // 800ms 让玩家看清图案再翻回去
  }
}

function init(){
  if(timer){clearInterval(timer);timer=null;}
  let vals=shuffle([...EMOJIS,...EMOJIS]);
  cards=vals.map(v=>({v,open:false,matched:false}));
  first=second=null;locked=false;done=false;sec=0;
  try{SafeStorage.removeItem(SK);}catch{}
  document.getElementById('info').textContent='用时: 0 秒';
  renderBoard();
}

function restore(){
  try{
    const s=JSON.parse(SafeStorage.getItem(SK));
    if(s&&s.cards&&s.cards.length===16){
      cards=s.cards;first=s.first;second=s.second;done=s.done;sec=s.sec||0;
      locked=false;
      
      // 当场完成保存时的比对逻辑
      if(first!==null && second!==null){
        if(cards[first].v===cards[second].v){
          cards[first].matched=cards[second].matched=true;
        } else {
          cards[first].open=cards[second].open=false;
        }
        first=second=null;
      }
      
      if(!done&&!timer)timer=setInterval(tick,1000);
      document.getElementById('info').textContent=done?'完成！用时 '+sec+' 秒':'用时: '+sec+' 秒';
      renderBoard();
      return true;
    }
  }catch{}
  return false;
}

function getRecord(){try{return JSON.parse(SafeStorage.getItem('record-'+ID))||{name:'',score:Infinity};}catch{return{name:'',score:Infinity};}}
function setRecord(name,score){SafeStorage.setItem('record-'+ID,JSON.stringify({name,score}));}
function showRecord(){const r=getRecord();document.getElementById('record').textContent=r.name&&r.score!==Infinity?'当前纪录：'+r.score+' 秒（'+r.name+'）':'暂无纪录';}
function tryRecord(newSec){const r=getRecord();if(newSec<r.score){const name=prompt('破纪录了！用时 '+newSec+' 秒，请输入你的名字：');if(name&&name.trim()){setRecord(name.trim(),newSec);showRecord();}}}

showRecord();
if(!restore())init();
</script>
</body>
</html>
