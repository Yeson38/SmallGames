<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>贪吃蛇</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:380px;margin-bottom:12px}
.bar button{background:#6B3FA0;border:none;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px}
.bar button:hover{background:#56328a}
canvas{background:#fff;border:1px solid #d9d3e2;border-radius:8px;max-width:100%;touch-action:none}
.record{max-width:380px;width:100%;font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<div class="bar">
  <span id="info"></span>
  <button onclick="init()">重新开始</button>
</div>
<div class="record" id="record"></div>
<canvas id="cvs"></canvas>
<script>
const ID='snake';const N=20,S=18;
// 🔧 修复：全局先声明
let cvs = document.getElementById('cvs');
let ctx = cvs.getContext('2d');
let snake,dir,nextDir,food,score,over,timer;

const SafeStorage = (function() {
  let storage;
  try { const t='__t__'; window.localStorage.setItem(t,t); window.localStorage.removeItem(t); storage=window.localStorage; } 
  catch(e) { const m={}; storage={getItem:k=>m[k]||null,setItem:(k,v)=>m[k]=String(v),removeItem:k=>delete m[k]}; }
  return storage;
})();

function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
function draw(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cvs.width,cvs.height);ctx.fillStyle='#6B3FA0';snake.forEach(s=>ctx.fillRect(s.x*S+1,s.y*S+1,S-2,S-2));ctx.fillStyle='#333';ctx.fillRect(food.x*S+2,food.y*S+2,S-4,S-4);}

function tick(){
  if(over)return;
  dir = nextDir;
  let head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  let willEat = (head.x===food.x && head.y===food.y);
  let bodyToCheck = willEat ? snake : snake.slice(0, -1);
  
  if(head.x<0||head.x>=N||head.y<0||head.y>=N||bodyToCheck.some(s=>s.x===head.x&&s.y===head.y)){
    over=true;setInfo('游戏结束，分数: '+score);tryRecord(score);return;
  }
  snake.unshift(head);
  if(willEat){score++;placeFood();setInfo('分数: '+score);}
  else snake.pop();
  draw();
}

function setInfo(t){document.getElementById('info').textContent=t;}
function init(){
  if(timer)clearInterval(timer);
  cvs.width=cvs.height=N*S;
  snake=[{x:10,y:10}];
  dir={x:1,y:0};
  nextDir={x:1,y:0};
  score=0;over=false;
  placeFood();draw();setInfo('分数: 0');
  timer=setInterval(tick,140);
}

function changeDir(d) {
  if(d.x === -nextDir.x && d.y === -nextDir.y) return;
  nextDir = d;
}

document.addEventListener('keydown',e=>{
  const m={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};
  if(m[e.key]){
    changeDir(m[e.key]);
    e.preventDefault();
  }
});

let sx, sy;
cvs.addEventListener('touchstart', e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; e.preventDefault(); }, {passive:false});
cvs.addEventListener('touchend', e=>{
  let dx = e.changedTouches[0].clientX - sx;
  let dy = e.changedTouches[0].clientY - sy;
  if(Math.abs(dx) < 20 && Math.abs(dy) < 20) return; 
  if(Math.abs(dx) > Math.abs(dy)) changeDir({x: dx>0?1:-1, y:0});
  else changeDir({x:0, y: dy>0?1:-1});
  e.preventDefault();
}, {passive:false});

function getRecord(){try{return JSON.parse(SafeStorage.getItem('record-'+ID))||{name:'',score:0};}catch{return{name:'',score:0};}}
function setRecord(name,score){SafeStorage.setItem('record-'+ID,JSON.stringify({name,score}));}
function showRecord(){const r=getRecord();document.getElementById('record').textContent=r.name?'当前纪录：'+r.score+'（'+r.name+'）':'暂无纪录';}
function tryRecord(newScore){const r=getRecord();if(newScore>r.score){const name=prompt('破纪录了！请输入你的名字：');if(name&&name.trim()){setRecord(name.trim(),newScore);showRecord();}}}
showRecord();init();
</script>
</body>
</html>
