<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>五子棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;color:#222;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px}
.bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:420px;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.bar a,.bar button{background:#6B3FA0;border:none;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;text-decoration:none}
.bar a:hover,.bar button:hover{background:#56328a}
canvas{background:#f0d9a0;border:1px solid #b8956a;border-radius:4px;max-width:100%;cursor:pointer;display:block}
.record{max-width:420px;width:100%;font-size:13px;color:#666;margin-bottom:8px}
</style>
</head>
<body>
<div class="bar">
  <a href="javascript:history.back()">返回</a>
  <span id="info"></span>
  <button onclick="init()">重新开始</button>
</div>
<div class="record" id="record"></div>
<canvas id="cvs"></canvas>
<script>
const ID='gomoku';
const N=15;
let board,turn,over,lastMove,busy;
let sec,timer,infoBase;
let botTimer = null; // 🔧 修复：AI 定时器句柄

const SafeStorage = (function() {
  let storage;
  try {
    const testKey = '__test__';
    window.localStorage.setItem(testKey, testKey);
    window.localStorage.removeItem(testKey);
    storage = window.localStorage;
  } catch (e) {
    const memory = {};
    storage = {
      getItem: (k) => memory[k] || null,
      setItem: (k, v) => { memory[k] = String(v); },
      removeItem: (k) => { delete memory[k]; }
    };
  }
  return storage;
})();

function getCanvasSize() {
  let w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth || 420;
  let s = Math.min(w - 32, 420);
  return (isNaN(s) || s < 100) ? 340 : s;
}

function init(){
  if(timer){clearInterval(timer);timer=null;}
  if(botTimer){clearTimeout(botTimer);botTimer=null;} // 🔧 修复：重开时清空未执行的 AI 回合
  
  board=Array.from({length:N},()=>Array(N).fill(0));
  turn=1;over=false;lastMove=null;busy=false;
  sec=0;
  cvs=document.getElementById('cvs');
  
  size = getCanvasSize();
  cvs.width = size; 
  cvs.height = size;
  
  ctx=cvs.getContext('2d');
  cell=size/N;
  drawBoard();
  setInfo('黑棋落子');
  showRecord();
  timer=setInterval(tick,1000);
  save();
}

function tick(){
  if(over)return;
  sec++;
  setInfo(infoBase);
  save();
}

function setInfo(t){
  infoBase=t;
  document.getElementById('info').textContent=t+(over?'':' · '+sec+'s');
}

function drawBoard(){
  if(!ctx) return;
  ctx.fillStyle='#f0d9a0';ctx.fillRect(0,0,size,size);
  ctx.strokeStyle='#b8956a';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    ctx.beginPath();ctx.moveTo(cell/2+i*cell,0);ctx.lineTo(cell/2+i*cell,size);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,cell/2+i*cell);ctx.lineTo(size,cell/2+i*cell);ctx.stroke();
  }
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]){
      ctx.beginPath();
      ctx.arc(c*cell+cell/2,r*cell+cell/2,cell*0.4,0,Math.PI*2);
      ctx.fillStyle=board[r][c]===1?'#000':'#fff';
      ctx.fill();
      ctx.strokeStyle=board[r][c]===1?'#000':'#ccc';
      ctx.lineWidth=1;ctx.stroke();
    }
  }
  if(lastMove){
    let[lr,lc]=lastMove;
    ctx.beginPath();
    ctx.arc(lc*cell+cell/2,lr*cell+cell/2,cell*0.12,0,Math.PI*2);
    ctx.fillStyle=board[lr][lc]===1?'#fff':'#000';
    ctx.fill();
  }
}

function place(e){
  if(over||busy||turn!==1)return;
  const rect=cvs.getBoundingClientRect();
  const scale = size / rect.width;
  const x=(e.clientX-rect.left)*scale, y=(e.clientY-rect.top)*scale;
  const c=Math.round((x-cell/2)/cell), r=Math.round((y-cell/2)/cell);
  if(r<0||r>=N||c<0||c>=N||board[r][c])return;
  doMove(r,c);
  if(!over){
    busy=true;
    setInfo('白棋思考中…');
    botTimer = setTimeout(botTurn, 80); // 🔧 修复：接管定时器
  }
}

function doMove(r,c){
  board[r][c]=turn;lastMove=[r,c];
  drawBoard();
  if(checkWin(r,c,turn)){
    over=true;
    if(timer){clearInterval(timer);timer=null;}
    const playerWon=(turn===1);
    setInfo((turn===1?'黑棋':'白棋')+' 获胜！');
    if(playerWon){
      tryRecord(sec);
    }
    save();return;
  }
  if(board.flat().every(v=>v)){
    over=true;
    if(timer){clearInterval(timer);timer=null;}
    setInfo('平局！');
    save();return;
  }
  turn=3-turn;save();
  if(!over)setInfo(turn===1?'黑棋落子':'白棋落子');
}

function botTurn(){
  if(over)return;
  let[r,c]=bestMove(2);
  busy=false;
  doMove(r,c);
}

function checkWin(r,c,p){
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let[dr,dc]of dirs){
    let cnt=1;
    for(let i=1;i<5;i++){let nr=r+dr*i,nc=c+dc*i;if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p)cnt++;else break;}
    for(let i=1;i<5;i++){let nr=r-dr*i,nc=c-dc*i;if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p)cnt++;else break;}
    if(cnt>=5)return true;
  }
  return false;
}

function bestMove(p){
  let best=-Infinity,br=7,bc=7;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c])continue;
    if(!near(r,c,2))continue;
    let a=evalPoint(r,c,p),d=evalPoint(r,c,3-p);
    let s=a*1.1+d;
    if(s>best){best=s;br=r;bc=c;}
  }
  return[br,bc];
}

function near(r,c,rad){
  for(let dr=-rad;dr<=rad;dr++)for(let dc=-rad;dc<=rad;dc++){
    let nr=r+dr,nc=c+dc;
    if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc])return true;
  }
  return false;
}

function evalPoint(r,c,p){
  let total=0;
  const dirs=[[1,0],[0,1],[1,1],[1,-1]];
  for(let[dr,dc]of dirs){
    let cnt=1,open=0;
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p){cnt++;nr+=dr;nc+=dc;}
    if(nr>=0&&nr<N&&nc>=0&&nc<N&&!board[nr][nc])open++;
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p){cnt++;nr-=dr;nc-=dc;}
    if(nr>=0&&nr<N&&nc>=0&&nc<N&&!board[nr][nc])open++;
    if(cnt>=5){total+=100000;continue;}
    if(open===0)continue;
    if(cnt===4){total+=open===2?10000:1000;}
    else if(cnt===3){total+=open===2?1000:100;}
    else if(cnt===2){total+=open===2?100:10;}
    else if(cnt===1){total+=open===2?10:1;}
  }
  return total;
}

cvs=document.getElementById('cvs');
cvs.addEventListener('click',place);

function save(){
  try{ SafeStorage.setItem('game-'+ID+'-state', JSON.stringify({board,turn,sec,over,lastMove})); }catch{}
}

function restore(){
  try{
    const s = JSON.parse(SafeStorage.getItem('game-'+ID+'-state'));
    if(s && s.board && Array.isArray(s.board) && s.board.length===N){
      let isValid = true;
      for(let i=0; i<N; i++){
        if(!Array.isArray(s.board[i]) || s.board[i].length !== N) { isValid = false; break; }
      }
      
      if(isValid){
        board=s.board;turn=s.turn;over=s.over;lastMove=s.lastMove;busy=false;
        sec=s.sec||0;
        if(timer){clearInterval(timer);timer=null;}
        if(botTimer){clearTimeout(botTimer);botTimer=null;}
        cvs=document.getElementById('cvs');
        
        size = getCanvasSize();
        cvs.width = size; 
        cvs.height = size;
        
        ctx=cvs.getContext('2d');cell=size/N;
        drawBoard();
        setInfo(over?(s.turn===1?'黑棋落子':'白棋落子'):(turn===1?'黑棋落子':'白棋落子'));
        
        if(!over){
          timer=setInterval(tick,1000);
          if(turn===2){
            busy=true;
            setInfo('白棋思考中…');
            botTimer = setTimeout(botTurn, 300); // 🔧 修复：这里也要用句柄
          }
        } else {
           setInfo((turn===1?'黑棋':'白棋')+' 获胜！');
        }
        showRecord();
        return true;
      }
    }
  }catch(e){}
  return false;
}

function getRecord(){
  try{ return JSON.parse(SafeStorage.getItem('record-'+ID)) || {name:'',score:Infinity}; }
  catch{ return {name:'',score:Infinity}; }
}
function setRecord(name,score){ SafeStorage.setItem('record-'+ID, JSON.stringify({name,score})); }
function showRecord(){
  const r=getRecord();
  document.getElementById('record').textContent=
    (r.name&&r.score!==Infinity)?('最快获胜：'+r.score+' 秒（'+r.name+'）'):'暂无纪录';
}
function tryRecord(newSec){
  const r=getRecord();
  if(newSec<r.score){
    const name=prompt('新纪录！用时 '+newSec+' 秒，请输入你的名字：');
    if(name&&name.trim()){setRecord(name.trim(),newSec);showRecord();}
  }
}

showRecord();
if(!restore())init();
</script>
</body>
</html>
